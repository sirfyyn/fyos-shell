<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent</title>
  <link rel="stylesheet" href="chat.css">
  <link rel="stylesheet" href="arbeitsplatz.css">
</head>
<body>
  <div class="app" id="app">
    <aside id="leiste" class="leiste" aria-label="Sitzungen">
      <div class="leiste-kopf">
        <button id="neueSitzung" type="button" class="primaer neu-knopf" aria-keyshortcuts="Meta+Shift+O Control+Shift+O">Neue Sitzung</button>
      </div>
      <form id="neuForm" class="neu-form" autocomplete="off" hidden>
        <label for="neuTitel">Titel (optional)</label>
        <input id="neuTitel" type="text" maxlength="120" placeholder="Neue Sitzung">
        <label for="neuOrdner">Arbeitsordner</label>
        <select id="neuOrdner"></select>
        <p id="neuPfad" class="leise neu-pfad"></p>
        <label for="neuModell" id="neuModellLabel">Modell</label>
        <select id="neuModell"></select>
        <p id="neuFehler" class="neu-fehler" role="alert" hidden></p>
        <div class="neu-knoepfe">
          <button id="neuAbbrechen" type="button">Abbrechen</button>
          <button id="neuAnlegen" type="submit" class="primaer">Anlegen</button>
        </div>
      </form>
      <nav class="leiste-liste" aria-label="Sitzungsliste">
        <div id="sitzungsliste" role="listbox" aria-label="Sitzungen" aria-orientation="vertical"></div>
        <p id="sitzungenLeer" class="leise leer-hinweis" hidden>Noch keine Sitzung.</p>
        <button id="weitereKopf" type="button" class="weitere-kopf" aria-expanded="false" aria-controls="weitereListe" hidden>
          <span class="chev"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.5L10 8l-4.5 4.5" /></svg></span>
          Hintergrund <span id="weitereZahl" class="chip">0</span>
        </button>
        <div id="weitereListe" role="listbox" aria-label="Hintergrundarbeit" hidden></div>
      </nav>
      <div class="leiste-fuss leise" id="leisteFuss"></div>
    </aside>

    <div class="haupt">
      <header class="kopf">
        <div class="kopf-links">
          <button id="leisteSchalter" type="button" class="leise-knopf leiste-schalter" aria-controls="leiste" aria-expanded="true" title="Seitenleiste ein- oder ausblenden (Cmd/Strg+B)">Sitzungen</button>
          <span id="avatar" class="avatar" aria-hidden="true">A</span>
          <div class="kopf-text">
            <h1 id="titel">Agent</h1>
            <div class="unterzeile"><span id="verbindung">verbinde …</span><span id="ordner" class="ordner" hidden></span></div>
          </div>
        </div>
        <div class="kopf-rechts">
          <button id="bericht" type="button" class="leise-knopf" title="Schreibt eine Textdatei mit Version, Meldungen und geschwärzten Einstellungen auf den Schreibtisch. Es wird nichts hochgeladen.">Bericht speichern</button>
          <span id="zustand" class="zustand bereit" role="status"><span class="punkt" aria-hidden="true"></span><span id="zustandText">bereit</span></span>
        </div>
      </header>

      <div class="mitte">
        <div id="banner" class="banner" role="status" hidden></div>
        <div id="panes" class="panes"></div>
      </div>

      <footer class="unten">
        <form id="eingabeForm" class="eingabe" autocomplete="off">
          <div id="menue" class="menue" role="listbox" aria-label="Vorschläge" hidden></div>
          <textarea id="eingabe" rows="1" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="menue" aria-label="Nachricht an den Agenten" placeholder="Nachricht …  /  für Befehle"></textarea>
          <div class="eingabe-zeile">
            <span class="hinweis">Enter sendet · Umschalt+Enter neue Zeile · Strg/Cmd+Enter greift ein</span>
            <span class="rechts">
              <button id="stopp" type="button" class="gefahr" hidden aria-keyshortcuts="Escape">Stopp <kbd>Esc</kbd></button>
              <button id="senden" type="submit" class="primaer">Senden</button>
            </span>
          </div>
        </form>
        <div class="statuszeile" aria-label="Status">
          <span class="modus-wrap">
            <button id="modus" type="button" class="modus-knopf" aria-haspopup="menu" aria-expanded="false">Berechtigungen umgehen</button>
            <div id="modusMenue" class="modus-menue" role="menu" aria-label="Modus" hidden></div>
          </span>
          <span id="modell" class="modell-knopf" title="Modell">–</span>
          <span id="kontext" class="kontext" role="meter" aria-label="Kontextfüllung" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-stufe="ok">
            <span class="balken" aria-hidden="true"><i></i></span>
            <span id="kontextText">–</span>
            <span id="kontextTitel" class="leise"></span>
          </span>
          <span id="tokens" class="leise"></span>
          <span id="kosten" class="leise"></span>
        </div>
      </footer>
    </div>
    <div id="ansage" class="sr" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script src="markdown-strom.js"></script>
  <script src="terminal.js"></script>
  <script src="chat-renderer.js"></script>
  <script src="runner-adapter.js"></script>
  <script src="echt.js"></script>
  <script src="modus.js"></script>
  <script src="sitzungen.js"></script>
  <script src="leiste.js"></script>
  <script src="chat.js"></script>
</body>
</html>
