# Build and self-test (unsigned). Jobs: `pruefen` on every push/PR (tests, build, --selbsttest on ubuntu/macos/windows),
# `release` only by hand (workflow_dispatch with release=true): unsigned installers with SHA-256 checksums.
name: Bauen und Selbsttest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      profil:
        description: "Profil: studio, agent oder os"
        default: studio
      release:
        description: "Installationspakete bauen und als Artefakte ablegen"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pruefen:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Systempakete (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev patchelf xvfb xauth dbus dbus-x11 libgl1-mesa-dri libglx-mesa0
      - name: Werkzeuge
        run: npm ci
      - name: Rust-Tests
        run: cargo test --workspace
      - name: Python-Tests der Werkzeuge
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Bau (Debug, ohne Paket, ohne Signierung)
        run: python tools/bauen.py "${{ inputs.profil || 'studio' }}" --debug --ohne-paket
      - name: Selbsttest
        run: python tools/selbsttest_ci.py "target/debug/fyos-shell${{ runner.os == 'Windows' && '.exe' || '' }}"

  release:
    if: ${{ inputs.release }}
    needs: pruefen
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, buendel: appimage }
          - { os: macos-14, buendel: "app,dmg" }
          - { os: windows-latest, buendel: nsis }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Systempakete (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - run: npm ci
      - name: Bau (Release, ungesignierte Installationspakete)
        env:
          # Nur gesetzt, wenn das Repo das Geheimnis dieses Profils kennt; leer = Pakete ohne Update-Fähigkeit.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python tools/bauen.py "${{ inputs.profil || 'studio' }}" --bundles "${{ matrix.buendel }}"
      - name: Prüfsummen
        run: |
          mkdir -p ausgabe
          find target/release/bundle -type f \( -name '*.AppImage' -o -name '*.dmg' -o -name '*-setup.exe' -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec cp {} ausgabe/ \;
          python tools/pruefsummen.py ausgabe/* > ausgabe/SHA256SUMS
          cat ausgabe/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: fyos-shell-${{ matrix.os }}
          path: ausgabe/*
          if-no-files-found: error
